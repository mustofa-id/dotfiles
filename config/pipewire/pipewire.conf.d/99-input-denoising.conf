context.modules = [
  {
    name = libpipewire-module-filter-chain

    args = {
      node.description = "RNNoise Microphone"
      media.name = "RNNoise Microphone"

      filter.graph = {
        nodes = [
          {
            type = builtin
            name = hp
            label = bq_highpass

            control = {
              "Freq" = 85
              "Q" = 0.707
            }
          }
          {
            type = ladspa
            name = rnnoise
            plugin = ladspa/librnnoise_ladspa
            label = noise_suppressor_mono

            control = {
              "VAD Threshold (%)" = 30.0
            }
          }
          {
            type = ladspa
            name = makeup
            plugin = ladspa/amp
            label = amp_mono

            control = {
              "Gain" = 5.4
            }
          }
          {
            type = ladspa
            name = lim
            plugin = ladspa/hard_limiter_1413
            label = hardLimiter

            control = {
              "dB limit" = -1.0
              "Wet level" = 1.0
              "Residue level" = 0.0
            }
          }
        ]

        links = [
          { output = "hp:Out" input = "rnnoise:Input" }
          { output = "rnnoise:Output" input = "makeup:Input" }
          { output = "makeup:Output" input = "lim:Input" }
        ]
      }

      capture.props = {
        node.name = "capture.rnnoise"
        node.description = "RNNoise Microphone Capture"
        node.target = "alsa_input.pci-0000_00_1f.3.analog-stereo"
        node.passive = true

        audio.channels = 1
        audio.position = [ MONO ]
      }

      playback.props = {
        node.name = "rnnoise_microphone"
        node.description = "RNNoise Microphone"
        media.name = "RNNoise Microphone"
        media.class = "Audio/Source"

        audio.channels = 1
        audio.position = [ MONO ]
      }
    }
  }
]
