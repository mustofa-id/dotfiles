# ALC256 / HDA Intel PCH card properties
#
# api.alsa.soft-mixer MUST stay off on this machine.
#
# It was once enabled to make the PipeWire volume slider a software gain after
# the ADC. ACP does not apply that per direction: with soft-mixer on it skips
# writing the route volume to the hardware entirely, so on every sink creation
# the DAC amps stay at 0 (-65.25 dB) and each output is silent no matter what
# the slider says:
#
#   Speaker Playback Volume  0/87   0%  -65.25 dB  [off]
#   Headphone Playback Volume 0/87  0%  -65.25 dB  [off]
#
# It also creates a second, invisible volume layer. ALSA-only apps (Concat
# links libasound.so.2 and never loads libpulse) write Master/PCM directly, so
# alsamixer and the system slider drift apart and neither reflects the other.
#
# With soft-mixer off there is exactly one volume stage: ACP drives the hardware
# mixer and the PipeWire slider *is* alsamixer's Master (verified both ways,
# same dB). Same for capture: the mic slider maps to Internal Mic Boost +
# Capture Volume, and ~25% lands on Boost 0 / Capture 54 (+23 dB), which is the
# sane operating point for this codec.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = false
      }
    }
  }
]
